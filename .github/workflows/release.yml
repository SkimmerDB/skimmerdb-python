# Publishes skimmerdb to PyPI when a version tag (v0.1.0) is pushed: `make clients-sync` in the
# SkimmerDB repository pushes the snapshot and its tag. Trusted publishing (OIDC): no API token;
# PyPI trusts this repository, this workflow and the `pypi` environment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel installs and imports
        run: |
          python -m venv /tmp/t && /tmp/t/bin/pip install dist/*.whl
          cd /tmp && /tmp/t/bin/python -c 'import skimmerdb; print(skimmerdb.__version__, skimmerdb.DEFAULT_URL)'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
